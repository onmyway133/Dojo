[package]
name = "dojo"
version = "1.1.3"
description = "Developer tools for macOS"
authors = ["Khoa Pham"]
license = "AGPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dojo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-clipboard-manager = "2"
thiserror = "2"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
sha3 = "0.12.0"
hex = "0.4.3"
hmac = "0.13.0"
base64 = "0.23.1"
tauri-plugin-dialog = "2"
digest = "0.11"
toml = { version = "1.1.8", features = ["preserve_order"] }
flate2 = "1.1.10"
x509-parser = "0.18.1"
rsa = { version = "0.9.10", features = ["pem"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
rand_core = { version = "0.6", features = ["getrandom"] }
oxipng = { version = "10.2.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
if-addrs = "0.15.0"
tauri-plugin-process = "2"
bcrypt = "0.19.3"
plist = "1.10.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc macros and build scripts must keep their metadata; stripping them makes rustc
# report "can't find crate" with the Xcode 27 linker. The app binary is still stripped.
[profile.release.build-override]
strip = false

# Dependencies (RSA, image codecs) are unusably slow unoptimized; keep our own crate fast to rebuild.
[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
